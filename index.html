<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Delivery Driver</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">

    <section id="login-view" class="login-view">
      <div class="login-background"></div>

      <div class="login-card">
        <div class="brand-mark">
          <div class="brand-icon">N</div>
          <div>
            <div class="brand-name">NAS EGYPT</div>
            <div class="brand-subtitle">Delivery Management</div>
          </div>
        </div>

        <div class="login-heading">
          <h1>مرحباً بك</h1>
          <p>سجل الدخول لإدارة طلبات التوصيل</p>
        </div>

        <form id="login-form" autocomplete="on">
          <div class="field">
            <label for="username">اسم المستخدم</label>
            <div class="input-wrap">
              <span class="input-icon">👤</span>
              <input id="username" name="username" type="text" placeholder="أدخل اسم المستخدم" autocomplete="username" required>
            </div>
          </div>

          <div class="field">
            <label for="password">كلمة المرور</label>
            <div class="input-wrap">
              <span class="input-icon">🔒</span>
              <input id="password" name="password" type="password" placeholder="أدخل كلمة المرور" autocomplete="current-password" required>
            </div>
          </div>

          <p id="login-error" class="login-error" hidden></p>

          <button id="login-btn" class="login-btn" type="submit">
            <span>تسجيل الدخول</span>
            <span class="login-arrow">←</span>
          </button>
        </form>

        <div class="login-footer">
          <span>NAS EGYPT</span>
          <span>•</span>
          <span>Delivery System</span>
        </div>
      </div>
    </section>

    <section id="orders-view" class="orders-view" hidden>
      <header class="topbar">
        <div class="topbar-inner">

          <div class="topbar-brand">
            <div class="mini-logo">N</div>
            <div class="brand-text">
              <strong>NAS EGYPT</strong>
              <span>Delivery</span>
            </div>
          </div>

          <div class="driver-profile">
            <div class="driver-avatar">🚚</div>
            <div class="driver-info">
              <strong id="driver-name">المندوب</strong>
              <span id="sheet-name">قائمة الطلبات</span>
            </div>
          </div>

          <div class="topbar-actions">
            <button id="refresh-btn" class="icon-btn" type="button" title="تحديث الطلبات" aria-label="تحديث الطلبات">↻</button>
            <button id="logout-btn" class="icon-btn logout-icon" type="button" title="تسجيل الخروج" aria-label="تسجيل الخروج">↪</button>
          </div>

        </div>
      </header>

      <main class="main-content">

        <section class="welcome-section">
          <div>
            <span class="eyebrow">لوحة المندوب</span>
            <h1>طلبات اليوم</h1>
            <p>تابع الطلبات وحدد طريقة الدفع وسجل التسليم بسهولة.</p>
          </div>
          <div class="orders-counter">
            <span id="orders-counter-number">0</span>
            <small>طلب</small>
          </div>
        </section>

        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon pending-icon">⏳</div>
            <div>
              <span>قيد التوصيل</span>
              <strong id="stat-pending">0</strong>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon done-icon">✓</div>
            <div>
              <span>تم التسليم</span>
              <strong id="stat-done">0</strong>
            </div>
          </div>
        </section>

        <nav class="tabs" aria-label="تصفية الطلبات">
          <button class="tab active" type="button" data-filter="pending">قيد التوصيل</button>
          <button class="tab" type="button" data-filter="done">تم التسليم</button>
          <button class="tab" type="button" data-filter="all">الكل</button>
        </nav>

        <section id="orders-list" class="orders-list"></section>

      </main>
    </section>

  </div>

  <div id="toast" class="toast" hidden></div>

  <template id="order-tpl">
    <article class="order-card">

      <div class="order-card-head">
        <div class="order-number">
          <span>طلب</span>
          <strong data-f="order_number">—</strong>
        </div>

        <div class="delivery-status" data-f="delivery_status">قيد التوصيل</div>
      </div>

      <div class="customer-row">
        <div class="customer-avatar">👤</div>
        <div class="customer-main">
          <h2 data-f="customer_name">—</h2>
          <a class="phone-link" data-f="phone">—</a>
        </div>
        <a class="call-btn action-icon" href="#" hidden title="اتصال" aria-label="اتصال">☎</a>
      </div>

      <div class="order-details">
        <div class="info-item">
          <span class="info-label">📍 المنطقة</span>
          <strong data-f="area">—</strong>
        </div>

        <div class="info-item">
          <span class="info-label">📝 الطلب</span>
          <strong data-f="order_details">—</strong>
        </div>

        <div class="info-item">
          <span class="info-label">📅 منسق الموعد</span>
          <strong data-f="appointment_coordinator">—</strong>
        </div>

        <div class="info-item note-item">
          <span class="info-label">💬 ملاحظات</span>
          <strong data-f="note">—</strong>
        </div>
      </div>

      <div class="order-total">
        <span>الإجمالي</span>
        <strong data-f="total">—</strong>
      </div>

      <div class="payment-section">
        <div class="payment-title">
          <span>طريقة الدفع</span>
          <small class="payment-current">لم يتم تحديد طريقة الدفع</small>
        </div>

        <div class="payment-buttons">
          <button class="payment-btn cash-btn" type="button" data-payment="cash">
            <span>💵</span>
            <strong>دفع كاش</strong>
          </button>

          <button class="payment-btn bank-btn" type="button" data-payment="bank_transfer">
            <span>🏦</span>
            <strong>تحويل بنكي</strong>
          </button>
        </div>
      </div>

      <div class="order-actions">
        <a class="location-btn" data-f="location_url" href="#" hidden target="_blank" rel="noopener noreferrer">
          <span>📍</span>
          <strong>فتح الموقع</strong>
        </a>

        <button class="btn-deliver" type="button">
          <span>✓</span>
          <strong>تم التسليم</strong>
        </button>
      </div>

    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
