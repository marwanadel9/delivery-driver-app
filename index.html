<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>فروج الزين</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* تكبير ووضوح بيانات الطلب فقط بدون تغيير باقي التصميم */
    .products-section-title strong {
      font-size: 18px !important;
      font-weight: 900 !important;
    }

    .product-value {
      font-size: 19px !important;
      font-weight: 900 !important;
      line-height: 2 !important;
      white-space: pre-line !important;
    }

    /* زر تم التسليم: أخضر قبل التسليم وأحمر بعد الضغط عليه */
    .btn-deliver {
      background: #16a34a !important;
      color: #ffffff !important;
      font-size: 16px !important;
      font-weight: 900 !important;
    }

    .order-card.is-done .btn-deliver,
    .btn-deliver:disabled {
      background: #dc2626 !important;
      color: #ffffff !important;
      opacity: 1 !important;
      cursor: default !important;
    }

    /* تحسين عرض المندوب على الهواتف دون تغيير وظائف الموقع */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
    }

    button, input, select, textarea, a {
      touch-action: manipulation;
    }

    button, .call-btn, .location-btn, .phone-link {
      -webkit-tap-highlight-color: transparent;
    }

    img, video, iframe {
      max-width: 100%;
    }

    @media (max-width: 650px) {
      .app-shell {
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
      }

      .topbar-inner {
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px 12px;
      }

      .topbar-brand {
        min-width: 0;
      }

      .driver-profile {
        flex: 1 1 100%;
        min-width: 0;
        order: 3;
      }

      .topbar-actions {
        margin-inline-start: auto;
      }

      .main-content {
        width: 100%;
        box-sizing: border-box;
        padding-inline: 12px;
      }

      .welcome-section {
        gap: 10px;
        align-items: center;
      }

      .welcome-section h1 {
        font-size: clamp(20px, 5.5vw, 26px);
      }

      .welcome-section p {
        font-size: 13px;
        line-height: 1.7;
      }

      .orders-counter {
        flex: 0 0 auto;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .stat-card {
        min-width: 0;
        padding: 12px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 8px 0;
        background: #f8fafc;
      }

      .tab {
        min-width: 0;
        padding: 10px 5px;
        font-size: 12px;
        white-space: normal;
      }

      .orders-list {
        gap: 12px;
      }

      .order-card {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        padding: 13px;
        border-radius: 16px;
      }

      .order-card-head,
      .customer-row,
      .order-total,
      .payment-title,
      .order-actions {
        gap: 9px;
      }

      .customer-main {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .customer-main h2 {
        font-size: 16px;
        line-height: 1.6;
      }

      .customer-location-grid,
      .order-details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .info-item {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .products-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .product-box {
        min-width: 0;
        padding: 10px;
        overflow-wrap: anywhere;
      }

      .product-value {
        display: block;
        font-size: clamp(17px, 4.8vw, 19px) !important;
        overflow-wrap: anywhere;
      }

      .payment-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .payment-btn {
        min-width: 0;
        min-height: 46px;
        padding: 10px 7px;
        gap: 5px;
      }

      .order-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .location-btn,
      .btn-deliver {
        min-width: 0;
        min-height: 48px;
        box-sizing: border-box;
        justify-content: center;
        padding: 11px 8px;
        font-size: 14px;
      }

      .toast {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: auto;
        box-sizing: border-box;
      }
    }

    @media (max-width: 380px) {
      .main-content {
        padding-inline: 9px;
      }

      .order-card {
        padding: 10px;
      }

      .customer-location-grid,
      .order-details {
        grid-template-columns: minmax(0, 1fr);
      }

      .order-actions {
        grid-template-columns: minmax(0, 1fr);
      }

      .master-top {
        flex-wrap: wrap;
      }
    }

    @supports (padding: max(0px)) {
      .main-content {
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }

  </style>

  <script>
    // توحيد روابط موقع العميل لتعمل على متصفحات الهواتف.
    // يدعم روابط Google Maps وروابط الإحداثيات أو العناوين، ويمنع فتح href="#" عند غياب الرابط.
    document.addEventListener("click", function (event) {
      const link = event.target.closest("a[data-f=\"location_url\"]");
      if (!link) return;

      const raw = (link.href && link.href !== window.location.href + "#")
        ? link.href
        : (link.getAttribute("data-location-url") || "");

      const value = String(raw || "").trim();
      if (!value || value === "#" || value === window.location.href + "#") {
        event.preventDefault();
        alert("رابط موقع العميل غير متوفر لهذه الفاتورة.");
        return;
      }

      let url;
      try {
        url = new URL(value, window.location.href);
      } catch (_) {
        event.preventDefault();
        alert("رابط موقع العميل غير صالح.");
        return;
      }

      if (url.protocol !== "http:" && url.protocol !== "https:" && url.protocol !== "geo:") {
        event.preventDefault();
        alert("رابط موقع العميل غير صالح.");
        return;
      }

      // على الهاتف افتح رابط HTTPS مباشرة في نفس التبويب لتجنب حظر النوافذ المنبثقة.
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        event.preventDefault();
        window.location.href = url.href;
      }
    }, true);
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
/* ============================================================
   FAVoice — ووكي توكي عبر Supabase Realtime Broadcast
   ضغطة سريعة = مايك مفتوح | ضغطة مطولة = ووكي توكي عادي
   ============================================================ */
(function () {
  var V = window.FAVoice = {
    cfg: null, sb: null, ch: null, rec: null, stream: null,
    seq: 0, q: [], playing: false, peers: {}, timer: null,
    talking: false, blocked: false, _maxT: null,

    init: function (cfg) {
      this.cfg = cfg || {};
      this._ui();
      this._unlockAudio();
      var self = this;
      if (!window.supabase || !cfg.key || String(cfg.key).length < 50) {
        this._status('⚠️ مفتاح Supabase غير مكتمل');
        return;
      }
      try {
        this.sb = window.supabase.createClient(cfg.url, cfg.key);
        this.ch = this.sb.channel(cfg.room, { config: { broadcast: { ack: false } } });
        this.ch.on('broadcast', { event: 'ptt' }, function (m) { self._chunk(m.payload || {}); });
        this.ch.on('broadcast', { event: 'ptt-hi' }, function (m) { self._hi(m.payload || {}); });
        this.ch.subscribe(function (status) {
          if (status === 'SUBSCRIBED') {
            self._status('🎙️ جاهز (v4)');
            self._hi({ from: cfg.id, name: cfg.name }, true);
            self.timer = setInterval(function () {
              self._hi({ from: cfg.id, name: cfg.name }, true);
            }, 12000);
          } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
            setTimeout(function () { self.init(self.cfg); }, 4000);
          }
        });
      } catch (e) { this._status('⚠️ ' + e.message); }
    },

    /* أول دوسة على الشاشة: تفك حظر الصوت وتشغل المخزن */
    _unlockAudio: function () {
      var self = this;
      var unlock = function () {
        try {
          var a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YQAAAAA=');
          a.play().catch(function () {});
        } catch (e) {}
        document.removeEventListener('pointerdown', unlock);
        document.removeEventListener('touchstart', unlock);
        if (self.blocked) {
          self.blocked = false;
          self._status('🔊 جاري تشغيل الرسائل...');
          self._play();
        }
      };
      document.addEventListener('pointerdown', unlock);
      document.addEventListener('touchstart', unlock);
    },

    _meter: null, _level: 0, _silentChunks: 0,

    _startMeter: function (st) {
      try {
        var AC = window.AudioContext || window.webkitAudioContext;
        this._actx = this._actx || new AC();
        var src = this._actx.createMediaStreamSource(st);
        var an = this._actx.createAnalyser(); an.fftSize = 512;
        src.connect(an);
        var buf = new Uint8Array(an.frequencyBinCount), self = this;
        clearInterval(this._meter);
        this._meter = setInterval(function () {
          an.getByteTimeDomainData(buf);
          var mx = 0;
          for (var i = 0; i < buf.length; i++) { var v = Math.abs(buf[i] - 128); if (v > mx) mx = v; }
          self._level = mx;
          if (self.talking) {
            if (mx < 8) self._status('🔴 بتتكلم... ⚠️ المايك ساكت! (' + mx + ')');
            else self._status('🔴 بتتكلم... 🎤 ' + mx);
          }
        }, 300);
      } catch (e) {}
    },

    start: function () {
      if (this.talking || this.rec) return;
      var self = this;
      navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      }).then(function (st) {
        self.stream = st;
        self._startMeter(st);
        self._silentChunks = 0;
        var mime = 'audio/webm;codecs=opus';
        if (!window.MediaRecorder || !MediaRecorder.isTypeSupported(mime)) mime = 'audio/webm';
        if (window.MediaRecorder && !MediaRecorder.isTypeSupported(mime)) mime = '';
        try { self.rec = new MediaRecorder(st, mime ? { mimeType: mime } : undefined); }
        catch (e) { self.rec = new MediaRecorder(st); }
        self.rec.ondataavailable = function (ev) {
          if (ev.data && ev.data.size > 0 && self.talking && ev.data.size < 150) {
            self._silentChunks++;
            if (self._silentChunks === 5) self._status('⚠️ المايك بيسجل سكون — افحص المايك في إعدادات ويندوز');
          } else if (ev.data && ev.data.size >= 150) self._silentChunks = 0;
          if (ev.data && ev.data.size > 0 && self.ch) {
            var r = new FileReader();
            r.onload = function () {
              var b64 = String(r.result).split(',')[1] || '';
              self.ch && self.ch.send({
                type: 'broadcast', event: 'ptt',
                payload: { d: b64, mime: self.rec.mimeType || 'audio/webm', from: self.cfg.id, name: self.cfg.name, seq: self.seq++ }
              });
            };
            r.readAsDataURL(ev.data);
          }
        };
        self.rec.start(200);
        self.talking = true;
        self._btnState(true);
        /* أمان: قفل تلقائي بعد 60 ثانية */
        clearTimeout(self._maxT);
        self._maxT = setTimeout(function () { if (self.talking) self.stop(); }, 60000);
      }).catch(function (e) { self._status('⚠️ المايك: ' + (e.message || 'مرفوض')); });
    },

    stop: function () {
      clearTimeout(this._maxT);
      clearInterval(this._meter);
      this.talking = false;
      this._btnState(false);
      try { if (this.rec && this.rec.state !== 'inactive') this.rec.stop(); } catch (e) {}
      this.rec = null;
      if (this.stream) { this.stream.getTracks().forEach(function (t) { t.stop(); }); this.stream = null; }
    },

    _chunk: function (p) {
      if (!p || !p.d || p.from === this.cfg.id) return;
      this._speaker(p.name);
      try {
        var bin = atob(p.d), arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        this.q.push(new Blob([arr], { type: p.mime || 'audio/webm' }));
        this._play();
      } catch (e) {}
    },

    _play: function () {
      if (this.playing || !this.q.length) return;
      this.playing = true;
      var self = this;
      var blob = this.q.shift();
      var u = window.URL.createObjectURL(blob);
      var a = new Audio(u);
      a.onended = function () { window.URL.revokeObjectURL(u); self.playing = false; self._play(); };
      a.onerror = function () { window.URL.revokeObjectURL(u); self.playing = false; self._play(); };
      a.play().then(function () {
        self._status('🔊 بيسمع: ' + (self._lastSpeaker || ''));
      }).catch(function () {
        self.q.unshift(blob);
        self.playing = false;
        if (!self.blocked) {
          self.blocked = true;
          self._status('🔊 وصل صوت — هيشتغل مع أول دوسة');
        }
      });
    },

    _hi: function (p, quiet) {
      if (!p || !p.from || p.from === this.cfg.id) return;
      this.peers[p.from] = p.name || p.from;
      if (!quiet && !this.talking && !this.blocked) this._status('🟢 ' + (p.name || p.from) + ' دخل القناة');
    },

    _ui: function () {
      if (document.getElementById('faPttBtn')) return;
      var self = this;
      var wrap = document.createElement('div');
      wrap.innerHTML =
        '<style>' +
        '#faPttBtn{position:fixed;left:14px;bottom:14px;z-index:2147483647;width:62px;height:62px;border-radius:50%;' +
        'background:linear-gradient(145deg,#1e9e6a,#12805a);color:#fff;font-size:27px;display:flex;align-items:center;' +

        '#faPttBtn.on{background:linear-gradient(145deg,#e85d5d,#b92e2e);transform:scale(1.12);box-shadow:0 0 0 10px rgba(232,93,93,.28);}' +
        '#faPttSts{position:fixed;left:14px;bottom:84px;z-index:2147483647;background:#0f2e21;color:#a8d5bd;padding:6px 13px;' +
        'border-radius:12px;font-size:12px;font-weight:700;max-width:250px;box-shadow:0 6px 16px rgba(0,0,0,.3);direction:rtl;}' +
        '#faPttSpk{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483647;display:none;' +
        'background:#b92e2e;color:#fff;padding:9px 22px;border-radius:24px;font-size:15px;font-weight:900;' +
        'box-shadow:0 8px 24px rgba(185,46,46,.4);direction:rtl;}</style>' +
        '<div id="faPttSts">🎙️ جاري الاتصال...</div>' +
        '<div id="faPttSpk"></div>' +
        '<div id="faPttBtn" title="دوسة سريعة=مفتوح | مطولة=ووكي توكي">🎙️</div>';
      document.body.appendChild(wrap);
      var btn = document.getElementById('faPttBtn');
      var downAt = 0, toggleMode = false;
      var start = function (e) {
        e.preventDefault();
        if (toggleMode) { toggleMode = false; self.stop(); return; }
        downAt = Date.now();
        self.start();
      };
      var stop = function (e) {
        e.preventDefault();
        if (!self.talking || toggleMode) return;
        if (Date.now() - downAt < 300) {
          toggleMode = true;
          self._status('🔴 المايك مفتوح — دوسة تانية تقفل');
        } else {
          self.stop();
        }
      };
      btn.addEventListener('pointerdown', start);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointerleave', function (e) { if (!toggleMode) stop(e); });
      btn.addEventListener('pointercancel', function (e) { if (!toggleMode) stop(e); });
      btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    },

    _btnState: function (on) {
      var b = document.getElementById('faPttBtn');
      if (b) { b.classList.toggle('on', on); b.textContent = on ? '📢' : '🎙️'; }
      if (on) this._status('🔴 بتتكلم...');
    },
    _status: function (t) {
      var s = document.getElementById('faPttSts');
      if (s) s.textContent = t;
    },
    _speaker: function (name) {
      this._lastSpeaker = name;
      var s = document.getElementById('faPttSpk');
      if (!s) return;
      s.textContent = '📢 ' + (name || 'حد') + ' بيتكلم...';
      s.style.display = 'block';
      clearTimeout(this._spkT);
      this._spkT = setTimeout(function () { s.style.display = 'none'; }, 1200);
    }
  };
})();

/* ============================================================
   location-fix.js — فتح موقع العميل: يصلح كل أشكال الروابط تلقائيًا
   ============================================================ */
(function () {
  function fix(u) {
    if (!u) return '';
    u = String(u).trim();
    for (var i = 0; i < 4; i++) {
      try { var d = decodeURIComponent(u); if (d === u) break; u = d; } catch (e) { break; }
    }
    u = u.replace(/&amp;/gi, '&').replace(/\s+/g, ' ').trim();
    if (/^(Open Location|موقع العميل|لا يوجد|null|undefined|#|-|0)$/i.test(u)) return '';
    var m = u.match(/(-?\d{1,2}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
    if (m) return 'https://www.google.com/maps/search/?api=1&query=' + m[1] + ',' + m[2];
    if (/^intent:\/\//i.test(u)) {
      var c = u.match(/!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/) || u.match(/@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/);
      if (c) return 'https://www.google.com/maps/search/?api=1&query=' + c[1] + ',' + c[2];
      var f = u.match(/browser_fallback_url=([^;]+)/i);
      if (f) { try { return fix(decodeURIComponent(f[1])); } catch (e) {} }
      return fix(u.replace(/^intent:\/\//i, 'https://'));
    }
    if (/^geo:/i.test(u)) return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(u.slice(4).split('?')[0]);
    if (!/^[a-z]+:/i.test(u)) u = 'https://' + u;
    if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps)/i.test(u)) return u;
    if (/google\.com\/maps/i.test(u) || /maps\.google\./i.test(u)) return u;
    return /^https?:\/\//i.test(u) ? u : '';
  }
  window.FAFixLocation = fix;
  function clean(root) {
    var links = root.querySelectorAll ? root.querySelectorAll('a[href]') : [];
    for (var i = 0; i < links.length; i++) {
      var a = links[i];
      var raw = a.getAttribute('data-location-url') || a.getAttribute('href') || '';
      var isLoc = a.getAttribute('data-f') === 'location_url' || a.classList.contains('location-btn')
        || /maps|goo\.gl|google\.com\/maps|geo:|intent:|^\s*-?\d+\.\d+\s*,/i.test(raw);
      if (!isLoc) continue;
      var ok = fix(raw);
      if (ok) { a.setAttribute('href', ok); a.setAttribute('data-location-url', ok); a.setAttribute('target', '_blank'); }
      else { a.setAttribute('href', '#'); a.setAttribute('data-location-url', ''); }
    }
  }
  clean(document);
  new MutationObserver(function (list) {
    for (var i = 0; i < list.length; i++) {
      for (var j = 0; j < list[i].addedNodes.length; j++) clean(list[i].addedNodes[j]);
    }
  }).observe(document.body, { childList: true, subtree: true });
})();
