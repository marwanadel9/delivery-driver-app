<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>فروج الزين</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    /* تكبير ووضوح بيانات الطلب فقط بدون تغيير باقي التصميم */
    .products-section-title strong {
      font-size: 18px !important;
      font-weight: 900 !important;
    }

    .product-value {
      font-size: 19px !important;
      font-weight: 900 !important;
      line-height: 2 !important;
      white-space: pre-line !important;
    }

    /* زر تم التسليم: أخضر قبل التسليم وأحمر بعد الضغط عليه */
    .btn-deliver {
      background: #16a34a !important;
      color: #ffffff !important;
      font-size: 16px !important;
      font-weight: 900 !important;
    }

    .order-card.is-done .btn-deliver,
    .btn-deliver:disabled {
      background: #dc2626 !important;
      color: #ffffff !important;
      opacity: 1 !important;
      cursor: default !important;
    }

    /* تحسين عرض المندوب على الهواتف دون تغيير وظائف الموقع */
    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      overflow-x: hidden;
    }

    button, input, select, textarea, a {
      touch-action: manipulation;
    }

    button, .call-btn, .location-btn, .phone-link {
      -webkit-tap-highlight-color: transparent;
    }

    img, video, iframe {
      max-width: 100%;
    }

    @media (max-width: 650px) {
      .app-shell {
        width: 100%;
        max-width: 100%;
        overflow-x: clip;
      }

      .topbar-inner {
        flex-wrap: wrap;
        gap: 10px;
        padding: 10px 12px;
      }

      .topbar-brand {
        min-width: 0;
      }

      .driver-profile {
        flex: 1 1 100%;
        min-width: 0;
        order: 3;
      }

      .topbar-actions {
        margin-inline-start: auto;
      }

      .main-content {
        width: 100%;
        box-sizing: border-box;
        padding-inline: 12px;
      }

      .welcome-section {
        gap: 10px;
        align-items: center;
      }

      .welcome-section h1 {
        font-size: clamp(20px, 5.5vw, 26px);
      }

      .welcome-section p {
        font-size: 13px;
        line-height: 1.7;
      }

      .orders-counter {
        flex: 0 0 auto;
      }

      .stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
      }

      .stat-card {
        min-width: 0;
        padding: 12px;
      }

      .tabs {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        position: sticky;
        top: 0;
        z-index: 5;
        padding: 8px 0;
        background: #f8fafc;
      }

      .tab {
        min-width: 0;
        padding: 10px 5px;
        font-size: 12px;
        white-space: normal;
      }

      .orders-list {
        gap: 12px;
      }

      .order-card {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
        padding: 13px;
        border-radius: 16px;
      }

      .order-card-head,
      .customer-row,
      .order-total,
      .payment-title,
      .order-actions {
        gap: 9px;
      }

      .customer-main {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .customer-main h2 {
        font-size: 16px;
        line-height: 1.6;
      }

      .customer-location-grid,
      .order-details {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .info-item {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .products-grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .product-box {
        min-width: 0;
        padding: 10px;
        overflow-wrap: anywhere;
      }

      .product-value {
        display: block;
        font-size: clamp(17px, 4.8vw, 19px) !important;
        overflow-wrap: anywhere;
      }

      .payment-buttons {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .payment-btn {
        min-width: 0;
        min-height: 46px;
        padding: 10px 7px;
        gap: 5px;
      }

      .order-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .location-btn,
      .btn-deliver {
        min-width: 0;
        min-height: 48px;
        box-sizing: border-box;
        justify-content: center;
        padding: 11px 8px;
        font-size: 14px;
      }

      .toast {
        left: 12px;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: auto;
        box-sizing: border-box;
      }
    }

    @media (max-width: 380px) {
      .main-content {
        padding-inline: 9px;
      }

      .order-card {
        padding: 10px;
      }

      .customer-location-grid,
      .order-details {
        grid-template-columns: minmax(0, 1fr);
      }

      .order-actions {
        grid-template-columns: minmax(0, 1fr);
      }

      .master-top {
        flex-wrap: wrap;
      }
    }

    @supports (padding: max(0px)) {
      .main-content {
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }

  </style>
<base target="_blank">
</head>
<body>

  <div class="app-shell">

    <section id="login-view" class="login-view">
      <div class="login-background"></div>

      <div class="login-card">

        <div class="brand-mark">
          <div class="brand-icon">🐔</div>
          <div>
            <div class="brand-name">فروج الزين</div>
            <div class="brand-subtitle">Delivery Management</div>
          </div>
        </div>

        <div class="login-heading">
          <h1>مرحباً بك</h1>
          <p>سجل الدخول لإدارة طلبات التوصيل</p>
        </div>

        <form id="login-form" autocomplete="on">

          <div class="field">
            <label for="username">اسم المستخدم</label>

            <div class="input-wrap">
              <span class="input-icon">👤</span>

              <input
                id="username"
                name="username"
                type="text"
                placeholder="أدخل اسم المستخدم"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div class="field">
            <label for="password">كلمة المرور</label>

            <div class="input-wrap">
              <span class="input-icon">🔒</span>

              <input
                id="password"
                name="password"
                type="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
              >
            </div>
          </div>

          <p id="login-error" class="login-error" hidden></p>

          <button id="login-btn" class="login-btn" type="submit">
            <span>تسجيل الدخول</span>
            <span class="login-arrow">←</span>
          </button>

        </form>

        <div class="login-footer">
          <span>فروج الزين</span>
          <span>•</span>
          <span>Delivery System</span>
        </div>

      </div>
    </section>


    <section id="orders-view" class="orders-view" hidden>

      <header class="topbar">

        <div class="topbar-inner">

          <div class="topbar-brand">

            <div class="mini-logo">🐔</div>

            <div class="brand-text">
              <strong>فروج الزين</strong>
              <span>Delivery</span>
            </div>

          </div>


          <div class="driver-profile">

            <div class="driver-avatar">🚚</div>

            <div class="driver-info">
              <strong id="driver-name">المندوب</strong>
              <span id="sheet-name">قائمة الطلبات</span>
            </div>

          </div>


          <div class="topbar-actions">

            <button
              id="refresh-btn"
              class="icon-btn"
              type="button"
              title="تحديث الطلبات"
              aria-label="تحديث الطلبات"
            >
              ↻
            </button>

            <button
              id="logout-btn"
              class="icon-btn logout-icon"
              type="button"
              title="تسجيل الخروج"
              aria-label="تسجيل الخروج"
            >
              ↪
            </button>

          </div>

        </div>

      </header>


      <main class="main-content">

        <section class="welcome-section">

          <div>
            <span class="eyebrow">لوحة المندوب</span>

            <h1>طلبات اليوم</h1>

            <p>
              تابع الطلبات وحدد طريقة الدفع وسجل التسليم بسهولة.
            </p>
          </div>

          <div class="orders-counter">
            <span id="orders-counter-number">0</span>
            <small>طلب</small>
          </div>

        </section>


        <section class="stats-grid">

          <div class="stat-card">

            <div class="stat-icon pending-icon">
              ⏳
            </div>

            <div>
              <span>قيد التوصيل</span>
              <strong id="stat-pending">0</strong>
            </div>

          </div>


          <div class="stat-card">

            <div class="stat-icon done-icon">
              ✓
            </div>

            <div>
              <span>تم التسليم</span>
              <strong id="stat-done">0</strong>
            </div>

          </div>

        </section>


        <nav class="tabs" aria-label="تصفية الطلبات">

          <button
            class="tab active"
            type="button"
            data-filter="pending"
          >
            قيد التوصيل
          </button>

          <button
            class="tab"
            type="button"
            data-filter="done"
          >
            تم التسليم
          </button>

          <button
            class="tab"
            type="button"
            data-filter="all"
          >
            الكل
          </button>

        </nav>


        <section
          id="orders-list"
          class="orders-list"
        ></section>

      </main>

    </section>

  </div>


  <div
    id="toast"
    class="toast"
    hidden
  ></div>


  <template id="order-tpl">

    <article class="order-card">


      <div class="order-card-head">

        <div class="order-number">

          <span>طلب</span>

          <strong data-f="order_number">
            —
          </strong>

        </div>

        <div
          class="delivery-status"
          data-f="delivery_status"
        >
          قيد التوصيل
        </div>

      </div>


      <div class="customer-row">

        <div class="customer-avatar">
          👤
        </div>

        <div class="customer-main">

          <h2 data-f="customer_name">
            —
          </h2>

          <a
            class="phone-link"
            data-f="phone"
          >
            —
          </a>

        </div>


        <a
          class="call-btn action-icon"
          href="#"
          hidden
          title="اتصال"
          aria-label="اتصال"
        >
          ☎
        </a>

      </div>


      <div class="customer-location-grid">

        <div class="info-item">

          <span class="info-label">
            🏙️ الإمارة
          </span>

          <strong data-f="emirate">
            —
          </strong>

        </div>


        <div class="info-item">

          <span class="info-label">
            📍 المنطقة
          </span>

          <strong data-f="area">
            —
          </strong>

        </div>

      </div>


      <section class="products-section chicken-section">

        <div class="products-section-head">

          <div class="products-section-title">

            <div>
              <strong>الدجاج الكامل</strong>
            </div>

          </div>

        </div>


        <div class="products-grid">

          <div class="product-box product-box-wide">

            <strong
              class="product-value"
              data-f="chicken_weights"
            >
              —
            </strong>

          </div>


          <div class="product-box" hidden>

            <strong
              class="product-value"
              data-f="chicken_qtys"
            >
              —
            </strong>

          </div>

        </div>

      </section>


      <section class="products-section cuts-section">

        <div class="products-section-head">

          <div class="products-section-title">

            <div>
              <strong>المقطعات</strong>
            </div>

          </div>

        </div>


        <div class="products-grid">

          <div class="product-box product-box-wide">

            <strong
              class="product-value"
              data-f="plate_names"
            >
              —
            </strong>

          </div>


          <div class="product-box" hidden>

            <strong
              class="product-value"
              data-f="plate_qtys"
            >
              —
            </strong>

          </div>

        </div>

      </section>


      <div class="order-details">

        <div class="info-item">

          <span class="info-label">
            📅 منسق الموعد
          </span>

          <strong data-f="appointment_coordinator">
            —
          </strong>

        </div>


        <div class="info-item note-item">

          <span class="info-label">
            💬 ملاحظات
          </span>

          <strong data-f="note">
            —
          </strong>

        </div>

      </div>


      <div class="order-total">

        <span>
          الإجمالي
        </span>

        <strong data-f="total">
          —
        </strong>

      </div>


      <div class="payment-section">

        <div class="payment-title">

          <span>
            طريقة الدفع
          </span>

          <small class="payment-current">
            لم يتم تحديد طريقة الدفع
          </small>

        </div>


        <div class="payment-buttons">

          <button
            class="payment-btn cash-btn"
            type="button"
            data-payment="cash"
          >
            <span>💵</span>
            <strong>دفع كاش</strong>
          </button>


          <button
            class="payment-btn bank-btn"
            type="button"
            data-payment="bank_transfer"
          >
            <span>🏦</span>
            <strong>تحويل بنكي</strong>
          </button>

        </div>

      </div>


      <div class="order-actions">

        <a
          class="location-btn"
          data-f="location_url"
          href="#"
          hidden
          target="_blank"
          rel="noopener noreferrer"
        >
          <span>📍</span>
          <strong>فتح الموقع</strong>
        </a>


        <button
          class="btn-deliver"
          type="button"
        >
          <span>✓</span>
          <strong>تم التسليم</strong>
        </button>

      </div>


    </article>

  </template>


  <script>
    // توحيد روابط موقع العميل لتعمل على متصفحات الهواتف.
    // يدعم روابط Google Maps وروابط الإحداثيات أو العناوين، ويمنع فتح href="#" عند غياب الرابط.
    document.addEventListener("click", function (event) {
      const link = event.target.closest("a[data-f=\"location_url\"]");
      if (!link) return;

      const raw = (link.href && link.href !== window.location.href + "#")
        ? link.href
        : (link.getAttribute("data-location-url") || "");

      const value = String(raw || "").trim();
      if (!value || value === "#" || value === window.location.href + "#") {
        event.preventDefault();
        alert("رابط موقع العميل غير متوفر لهذه الفاتورة.");
        return;
      }

      let url;
      try {
        url = new URL(value, window.location.href);
      } catch (_) {
        event.preventDefault();
        alert("رابط موقع العميل غير صالح.");
        return;
      }

      if (url.protocol !== "http:" && url.protocol !== "https:" && url.protocol !== "geo:") {
        event.preventDefault();
        alert("رابط موقع العميل غير صالح.");
        return;
      }

      // على الهاتف افتح رابط HTTPS مباشرة في نفس التبويب لتجنب حظر النوافذ المنبثقة.
      if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        event.preventDefault();
        window.location.href = url.href;
      }
    }, true);
  </script>
  <script src="/app.js"></script>

  </script>
</body>
</html>
